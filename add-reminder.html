<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care Planner - Add Reminder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal: #2a9d8f;
            --teal-dark: #217c72;
            --mint: #dff7f1;
            --sky: #dff1ff;
            --lavender: #eee7ff;
            --cream: #fffaf0;
            --white: #ffffff;
            --text: #29434e;
            --muted: #71828a;
            --shadow: 0 10px 30px rgba(42, 77, 89, 0.09);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #e9faf6 0, transparent 28%),
                radial-gradient(circle at top right, #edf5ff 0, transparent 25%),
                var(--cream);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e7eeee;
        }

        .nav-inner {
            max-width: 1250px;
            margin: auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: 800;
            color: var(--teal-dark);
            white-space: nowrap;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--mint);
            display: grid;
            place-items: center;
            font-size: 23px;
        }

        .nav-links {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a {
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--mint);
            color: var(--teal-dark);
        }

        .container {
            width: min(850px, calc(100% - 30px));
            margin: 0 auto;
        }

        .hero {
            margin: 30px 0 20px;
            padding: 32px;
            border-radius: 28px;
            background: linear-gradient(
                135deg,
                rgba(223,247,241,0.95),
                rgba(223,241,255,0.95)
            );
            box-shadow: var(--shadow);
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--muted);
            line-height: 1.6;
        }

        .form-card {
            background: var(--white);
            border-radius: 25px;
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9e5e7;
            border-radius: 14px;
            outline: none;
            background: #fbfdfd;
            color: var(--text);
            font-size: 14px;
            transition: 0.2s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(42,157,143,0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            border-radius: 13px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--teal);
            color: white;
        }

        .btn-primary:hover {
            background: var(--teal-dark);
        }

        .btn-soft {
            background: var(--mint);
            color: var(--teal-dark);
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 14px;
            background: var(--mint);
            color: var(--teal-dark);
            font-size: 14px;
            font-weight: 700;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 20px;
        }

        @media (max-width: 800px) {

            .nav-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            .container {
                width: min(100% - 20px, 850px);
            }

            .hero,
            .form-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="nav-inner">

        <a href="profile.html" class="brand">
            <span class="brand-icon">🐾</span>
            <span>Pet Care Planner</span>
        </a>

        <div class="nav-links">
            <a href="profile.html">Dashboard</a>
            <a href="add-pet.html">Add Pet</a>
            <a href="add-task.html">Tasks</a>
            <a href="add-vaccination.html">Vaccinations</a>
            <a href="add-reminder.html" class="active">Reminders</a>
            <a href="add-lost-pet.html">Lost Pet</a>
            <a href="breed-info.html">Breed Info</a>
            <a href="health.html">Health</a>
            <a href="care.html">Care</a>
            <a href="medicine.html">Medicine</a>
            <a href="ai-assistant.html">AI Assistant</a>
        </div>

    </div>

</nav>

<main class="container">

    <section class="hero">
        <h1>🔔 Add a Reminder</h1>
        <p>
            Create reminders for important pet-care activities.
        </p>
    </section>

    <div id="message" class="message"></div>

    <section class="form-card">

        <form id="reminderForm">

            <div class="form-group">

                <label for="title">
                    Reminder Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Give evening medicine"
                    required
                >

            </div>

            <div class="form-group">

                <label for="type">
                    Reminder Type
                </label>

                <select id="type" required>

                    <option value="">
                        Select reminder type
                    </option>

                    <option value="Feeding">
                        🍽️ Feeding
                    </option>

                    <option value="Medication">
                        💊 Medication
                    </option>

                    <option value="Grooming">
                        ✂️ Grooming
                    </option>

                    <option value="Vet Visit">
                        🩺 Vet Visit
                    </option>

                    <option value="Vaccination">
                        💉 Vaccination
                    </option>

                    <option value="Walking">
                        🐕 Walking
                    </option>

                    <option value="Training">
                        🎓 Training
                    </option>

                    <option value="Other">
                        🐾 Other
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="pet">
                    Pet
                </label>

                <select id="pet" required>

                    <option value="">
                        Select a pet
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >

            </div>

            <div class="form-group">

                <label for="time">
                    Time
                </label>

                <input
                    type="time"
                    id="time"
                >

            </div>

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Add any extra information..."
                ></textarea>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">
                    💾 Save Reminder
                </button>

                <a
                    href="profile.html"
                    class="btn btn-soft">
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

<footer>
    🐾 Pet Care Planner • Never miss an important moment
</footer>


<script>

    /* =========================================================
       LOAD PETS
    ========================================================= */

    function loadPets() {

        const pets =
            JSON.parse(localStorage.getItem("pets") || "[]");

        const petSelect =
            document.getElementById("pet");

        petSelect.innerHTML = `
            <option value="">
                Select a pet
            </option>
        `;

        pets.forEach(pet => {

            const petName =
                pet.name ||
                pet.petName ||
                "Unnamed Pet";

            const option =
                document.createElement("option");

            option.value = petName;
            option.textContent = petName;

            petSelect.appendChild(option);
        });
    }


    /* =========================================================
       SET TODAY'S DATE
    ========================================================= */

    function setToday() {

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(today.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(today.getDate())
                .padStart(2, "0");

        document.getElementById("date").value =
            `${year}-${month}-${day}`;
    }


    /* =========================================================
       SAVE REMINDER
       
       STEP 1:
       The standardized property is:
           pet

       Older reminders using petName are still supported
       by profile.html.
    ========================================================= */

    document
        .getElementById("reminderForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const title =
                document.getElementById("title")
                    .value
                    .trim();

            const type =
                document.getElementById("type")
                    .value;

            const pet =
                document.getElementById("pet")
                    .value;

            const date =
                document.getElementById("date")
                    .value;

            const time =
                document.getElementById("time")
                    .value;

            const notes =
                document.getElementById("notes")
                    .value
                    .trim();

            if (!title || !type || !pet || !date) {
                alert("Please fill in all required fields.");
                return;
            }

            let reminders =
                JSON.parse(
                    localStorage.getItem("reminders") || "[]"
                );

            const newReminder = {

                id: Date.now(),

                title: title,

                type: type,

                /* STEP 1 */
                pet: pet,

                date: date,

                time: time,

                notes: notes
            };

            reminders.push(newReminder);

            localStorage.setItem(
                "reminders",
                JSON.stringify(reminders)
            );

            const message =
                document.getElementById("message");

            message.textContent =
                "✅ Reminder saved successfully!";

            message.style.display = "block";

            document
                .getElementById("reminderForm")
                .reset();

            setToday();

            setTimeout(() => {
                window.location.href = "profile.html";
            }, 700);

        });


    /* =========================================================
       INITIALIZE
    ========================================================= */

    loadPets();

    setToday();

</script>

</body>
</html>
